# AurexaBrain - configuration
prefix: "&6&lAurexalium &c&l>> &e"

# Nombre de points pour gagner une partie
score-to-win: 5

# Decompte (en secondes) avant le debut quand assez de joueurs sont la
start-countdown: 15

# Commande console executee pour donner des coins
# {player} = pseudo, {amount} = montant. Laisse vide pour desactiver.
# Exemple Essentials : eco give {player} {amount}
coins-command: "eco give {player} {amount}"

coins:
  win: 100     # equipe gagnante
  lose: 20     # equipe perdante
  point: 10    # quand tu marques un point (toucher le lit)
  kill: 5      # quand tu tues un joueur
